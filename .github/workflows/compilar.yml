# Compila la aplicacion para Windows, Mac, Linux y Android en los servidores
# de GitHub y la publica como una "release" con sus enlaces de descarga.
# Se ejecuta a mano: pestana Actions > "Compilar la aplicación" > Run workflow.
name: Compilar la aplicación

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (por ejemplo 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  computadora:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            os: windows-latest
            destino: --win nsis --x64
          - nombre: Mac
            os: macos-latest
            destino: --mac dmg --universal
          - nombre: Linux
            os: ubuntu-latest
            destino: --linux deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npx electron-builder ${{ matrix.destino }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.nombre }}
          path: |
            dist/ANTI-EXAMEN5-Windows.exe
            dist/ANTI-EXAMEN5-Mac.dmg
            dist/ANTI-EXAMEN5-Linux.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preparar la llave de firma
        env:
          LLAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$LLAVE" | base64 -d > "$RUNNER_TEMP/llave.jks"
          echo "AE5_KEYSTORE_FILE=$RUNNER_TEMP/llave.jks" >> "$GITHUB_ENV"
      - name: Compilar el APK
        working-directory: android
        env:
          AE5_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -Pae5VersionName=${{ inputs.version }} -Pae5VersionCode=${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk ANTI-EXAMEN5-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-Android
          path: ANTI-EXAMEN5-Android.apk
          if-no-files-found: error

  publicar:
    name: Publicar
    needs: [computadora, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ANTI.EXAMEN5 ${{ inputs.version }}
          make_latest: true
          body: |
            Aplicación ANTI.EXAMEN5 para rendir exámenes supervisados.
            - Windows 10 y 11: ANTI-EXAMEN5-Windows.exe
            - Android 8 o posterior: ANTI-EXAMEN5-Android.apk
            - macOS 11 o posterior: ANTI-EXAMEN5-Mac.dmg
            - Ubuntu, Debian o Mint: ANTI-EXAMEN5-Linux.deb
          files: salida/*
